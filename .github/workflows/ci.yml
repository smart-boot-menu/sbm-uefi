name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi,aarch64-unknown-uefi
          components: rustfmt,clippy
      - name: Format, host lint, and host tests
        run: |
          cargo fmt --all -- --check
          cargo clippy -p sbm-boot -p sbm-gfx -p xtask --all-targets -- -D warnings
          cargo test
      - name: UEFI release lint and build
        run: |
          for target in aarch64-unknown-uefi x86_64-unknown-uefi; do
            cargo clippy -p sbm-app -p sbm-fixture --release --target "$target" -- -D warnings
            cargo build -p sbm-app -p sbm-fixture --release --target "$target"
          done
