[package]
name = "xtask"
description = "Build, patch, preview, and QEMU-test Smart Boot Menu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
libc = "0.2"
sbm-boot = { path = "../sbm-boot" }
sbm-gfx = { path = "../sbm-gfx" }
sbm-protocol = { workspace = true }
sbm-types = { workspace = true }
