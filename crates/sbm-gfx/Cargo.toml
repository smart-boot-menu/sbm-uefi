[package]
name = "sbm-gfx"
description = "no_std framebuffer renderer and boot-menu layout for Smart Boot Menu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Host-preview experimental hardware-bento layouts; excluded from production sbm-app builds.
experimental-layouts = ["dep:noto-sans-mono-bitmap"]

[dependencies]
noto-sans-mono-bitmap = { version = "0.4", default-features = false, features = ["regular", "bold", "size_16", "size_20", "size_24", "unicode-basic-latin", "unicode-latin-1-supplement"], optional = true }
