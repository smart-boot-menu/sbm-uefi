[package]
name = "sbm-preview"
description = "Native host preview of the Smart Boot Menu UEFI menu against a simulated computer (development tooling only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
window = ["dep:minifb"]

[[bin]]
name = "sbm-preview"
path = "src/main.rs"

[dependencies]
minifb = { version = "0.29", optional = true }
png = "0.18"
rapid-qoi.workspace = true
sbm-boot = { path = "../sbm-boot" }
sbm-gfx = { path = "../sbm-gfx", features = ["experimental-layouts"] }
sbm-menu = { path = "../sbm-menu" }
sbm-protocol = { workspace = true }
sbm-types = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
