[workspace]
resolver = "3"
members = [
    "crates/sbm-boot",
    "crates/sbm-gfx",
    "crates/sbm-app",
    "crates/sbm-fixture",
    "crates/xtask",
]
default-members = ["crates/sbm-boot", "crates/sbm-gfx", "crates/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smart-boot-menu/sbm-uefi"

[workspace.dependencies]
sbm-types = { git = "https://github.com/smart-boot-menu/sbm-common", rev = "28d38450954f0b93815e12f31da92370b13a7462", default-features = false }
sbm-protocol = { git = "https://github.com/smart-boot-menu/sbm-common", rev = "28d38450954f0b93815e12f31da92370b13a7462", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
uefi = { version = "0.41.0", default-features = false, features = ["alloc", "global_allocator", "panic_handler"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
