[workspace]
resolver = "3"
members = [
    "crates/sbm-boot",
    "crates/sbm-gfx",
    "crates/sbm-menu",
    "crates/sbm-preview",
    "crates/sbm-app",
    "crates/sbm-fixture",
    "crates/xtask",
]
default-members = ["crates/sbm-boot", "crates/sbm-gfx", "crates/sbm-menu", "crates/sbm-preview", "crates/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smart-boot-menu/sbm-uefi"

[workspace.dependencies]
ab_glyph_rasterizer = { version = "0.1", default-features = false, features = ["libm"] }
libm = "0.2"
qrcode = { version = "0.15", default-features = false }
rapid-qoi = { version = "0.6", default-features = false, features = ["alloc"] }
sbm-types = { git = "https://github.com/smart-boot-menu/sbm-common", rev = "abe3029c831f05d77d10cfb214a0c236903d00d9", default-features = false }
sbm-protocol = { git = "https://github.com/smart-boot-menu/sbm-common", rev = "abe3029c831f05d77d10cfb214a0c236903d00d9", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
ttf-parser = { version = "0.25", default-features = false, features = ["opentype-layout", "no-std-float"] }
uefi = { version = "0.41.0", default-features = false, features = ["alloc", "global_allocator", "panic_handler"] }

# Desktop preview repaints with sbm-gfx; UEFI binaries are always release builds.
[profile.dev.package.sbm-gfx]
opt-level = 3
[profile.dev.package.ab_glyph_rasterizer]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3
[profile.dev.package.libm]
opt-level = 3

# Screenshot encoding (sbm-preview headless and F12).
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Launch-time SHA-256 of the 75-81 MB recovery UKI dominates the cost of
# starting recovery. sha2 alone is built for speed; see MEASUREMENTS.md for
# the measured throughput and the EFI size cost.
[profile.release.package.sha2]
opt-level = 3
